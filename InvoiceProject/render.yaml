databases:
  - name: invoiceapp-db
    plan: free
    databaseName: invoiceapp
    user: invoiceapp

services:
  - type: web
    name: invoiceapp
    runtime: python
    plan: free
    rootDir: InvoiceProject
    buildCommand: "./build.sh"
    startCommand: "gunicorn InvoiceProject.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: invoiceapp-db
          property: connectionString
      # À compléter manuellement dans le dashboard Render après le premier déploiement
      # (Render vous donne l'URL finale, ex: invoiceapp.onrender.com) :
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Adresse qui reçoit les messages du formulaire de contact public
      - key: SUPPORT_EMAIL
        sync: false
      # Facultatif — laissez vide pour désactiver l'assistant IA
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Facultatif — paiement des abonnements (MoneyFusion)
      - key: MONEYFUSION_API_URL
        sync: false
      - key: SITE_BASE_URL
        sync: false
      # Facultatif — envoi d'e-mails réels (sinon affichés dans les logs)
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend