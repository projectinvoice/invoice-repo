<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier Client - {{ company_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .header-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6dd1 0%, #6b3f8f 100%);
        }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">
    <div class="header-section">
        <div>
            <h2>✏️ Modifier Client</h2>
            <p class="mb-0">Entreprise: {{ company_name }}</p>
        </div>
        <a href="{% url 'list_clients' %}" class="btn btn-light">← Retour</a>
    </div>

    <div class="form-card">
        <form id="clientForm">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="name" class="form-label">Nom du Client *</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ client.name }}" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ client.email }}">
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Téléphone</label>
                <input type="tel" class="form-control" id="phone" name="phone" value="{{ client.phone }}">
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">Adresse</label>
                <textarea class="form-control" id="address" name="address" rows="3">{{ client.address }}</textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">💾 Enregistrer les modifications</button>
                <a href="{% url 'list_clients' %}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>

        <div id="message" class="mt-3"></div>
    </div>
</div>

<script>
    document.getElementById('clientForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        try {
            const response = await fetch('', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            const msgDiv = document.getElementById('message');
            if (data.success) {
                msgDiv.innerHTML = '<div class="alert alert-success alert-dismissible fade show" role="alert">' + data.message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
                setTimeout(() => window.location.href = '{% url "list_clients" %}', 1500);
            } else {
                msgDiv.innerHTML = '<div class="alert alert-danger alert-dismissible fade show" role="alert">' + data.error + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
            }
        } catch (error) {
            console.error(error);
        }
    });
</script>

</body>
</html>
