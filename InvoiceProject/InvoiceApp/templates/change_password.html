<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le Mot de Passe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .breadcrumb {
            margin-bottom: 20px;
        }

        .breadcrumb a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="password"],
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus,
        input[type="text"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group small {
            display: block;
            margin-top: 5px;
            color: #999;
            font-size: 12px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        button.submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button.cancel {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        button.cancel:hover {
            background: #e0e0e0;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 22px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="breadcrumb">
            <a href="{% url 'dashboard' %}">← Retour au Dashboard</a>
        </div>

        <h1>🔐 Modifier le Mot de Passe</h1>

        <div class="alert success" id="successAlert" style="display: none;"></div>
        <div class="alert error" id="errorAlert" style="display: none;"></div>

        <form id="passwordForm">
            {% csrf_token %}

            <div class="form-group">
                <label for="old_password">Mot de passe actuel *</label>
                <input type="password" id="old_password" name="old_password" required placeholder="Entrez votre mot de passe">
                <small>Pour des raisons de sécurité, veuillez confirmer votre mot de passe actuel</small>
            </div>

            <div class="form-group">
                <label for="new_password">Nouveau mot de passe *</label>
                <input type="password" id="new_password" name="new_password" required placeholder="Au moins 8 caractères">
                <small>Le mot de passe doit contenir au minimum 8 caractères</small>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirmez le nouveau mot de passe *</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Répétez le nouveau mot de passe">
                <small>Les deux mots de passe doivent être identiques</small>
            </div>

            <div class="button-group">
                <button type="submit" class="submit">Mettre à Jour</button>
                <a href="{% url 'dashboard' %}" style="display: flex; align-items: center; justify-content: center; flex: 1; background: #f0f0f0; color: #333; text-decoration: none; border: 1px solid #ddd; border-radius: 5px; font-weight: bold;">Annuler</a>
            </div>

            <div class="loading" id="loading">
                <p>⏳ Mise à jour en cours...</p>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const old_password = document.getElementById('old_password').value;
            const new_password = document.getElementById('new_password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if (new_password.length < 8) {
                showError('Le mot de passe doit contenir au minimum 8 caractères');
                return;
            }

            if (new_password !== confirm_password) {
                showError('Les nouveaux mots de passe ne correspondent pas');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch('{% url "change_password" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: new URLSearchParams({
                        old_password,
                        new_password,
                        confirm_password
                    })
                });

                const data = await response.json();
                showLoading(false);

                if (data.success) {
                    showSuccess('Mot de passe modifié avec succès! Redirection...');
                    setTimeout(() => {
                        window.location.href = '{% url "dashboard" %}';
                    }, 2000);
                } else {
                    showError(data.error || 'Erreur lors de la modification');
                }
            } catch (error) {
                showLoading(false);
                showError('Erreur réseau: ' + error.message);
            }
        });

        function showError(message) {
            const alert = document.getElementById('errorAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('successAlert').style.display = 'none';
        }

        function showSuccess(message) {
            const alert = document.getElementById('successAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('errorAlert').style.display = 'none';
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('active', show);
            document.querySelector('button.submit').disabled = show;
        }
    </script>
</body>
</html>
