<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .breadcrumb {
            margin-bottom: 20px;
        }

        .breadcrumb a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group small {
            display: block;
            margin-top: 5px;
            color: #999;
            font-size: 12px;
        }

        .required {
            color: #e74c3c;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        button.submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button.submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .cancel-link {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-weight: bold;
        }

        .cancel-link:hover {
            background: #e0e0e0;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 22px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="breadcrumb">
            <a href="{% url 'dashboard' %}">← Retour au Dashboard</a>
        </div>

        <h1>👥 Ajouter un Agent</h1>

        <div class="alert success" id="successAlert" style="display: none;"></div>
        <div class="alert error" id="errorAlert" style="display: none;"></div>

        <form id="agentForm">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Nom complet <span class="required">*</span></label>
                <input type="text" id="name" name="name" required placeholder="Prénom et Nom">
                <small>Le nom de l'agent qui travaillera avec vous</small>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="agent@example.com">
                    <small>Optionnel - pour la communication</small>
                </div>

                <div class="form-group">
                    <label for="phone">Téléphone</label>
                    <input type="tel" id="phone" name="phone" placeholder="+33 6 12 34 56 78">
                    <small>Optionnel - numéro de contact</small>
                </div>
            </div>

            <div class="form-group">
                <label for="role_id">Rôle</label>
                <select id="role_id" name="role_id">
                    <option value="">-- Sélectionner un rôle --</option>
                    {% for role in roles %}
                        <option value="{{ role.id }}">{{ role.name }}</option>
                    {% endfor %}
                </select>
                <small>Attribuez un rôle à cet agent (optionnel)</small>
            </div>

            <div class="button-group">
                <button type="submit" class="submit">Créer l'Agent</button>
                <a href="{% url 'dashboard' %}" class="cancel-link">Annuler</a>
            </div>

            <div class="loading" id="loading">
                <p>⏳ Création en cours...</p>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('agentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const role_id = document.getElementById('role_id').value;

            if (!name) {
                showError('Le nom est obligatoire');
                return;
            }

            showLoading(true);

            try {
                const formData = new FormData();
                formData.append('name', name);
                if (email) formData.append('email', email);
                if (phone) formData.append('phone', phone);
                if (role_id) formData.append('role_id', role_id);
                formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);

                const response = await fetch('{% url "add_agent" %}', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                showLoading(false);

                if (data.success) {
                    showSuccess('Agent créé avec succès! Redirection...');
                    setTimeout(() => {
                        window.location.href = '{% url "dashboard" %}';
                    }, 2000);
                } else {
                    showError(data.error || 'Erreur lors de la création');
                }
            } catch (error) {
                showLoading(false);
                showError('Erreur réseau: ' + error.message);
            }
        });

        function showError(message) {
            const alert = document.getElementById('errorAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('successAlert').style.display = 'none';
        }

        function showSuccess(message) {
            const alert = document.getElementById('successAlert');
            alert.textContent = message;
            alert.style.display = 'block';
            document.getElementById('errorAlert').style.display = 'none';
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('active', show);
            document.querySelector('button.submit').disabled = show;
        }
    </script>
<script src="{% static 'InvoiceApp/js/ai_assistant.js' %}"></script>
</body>
</html>
