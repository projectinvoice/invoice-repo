<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lien d'activation invalide — MerchandBlock</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --mb-navy: #08244B;
            --mb-navy-hover: #0D3268;
            --bg-page: #F1F5F9;
            --bg-card: #FFFFFF;
            --border: #E2E8F0;
            --text-primary: #0F172A;
            --text-muted: #64748B;
            --rose: #E11D48;
            --radius: 14px;
            --radius-sm: 9px;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 12px 32px rgba(8, 36, 75, 0.07);
            max-width: 440px;
            width: 100%;
            padding: 38px 36px;
            text-align: center;
        }

        .icon {
            width: 56px;
            height: 56px;
            background: rgba(225, 29, 72, 0.08);
            border: 1px solid rgba(225, 29, 72, 0.22);
            color: var(--rose);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
        }

        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: var(--mb-navy);
            margin-bottom: 10px;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: var(--mb-navy);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            transition: background 0.15s ease;
        }

        .btn:hover {
            background: var(--mb-navy-hover);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <h1>Lien d'activation invalide ou expiré</h1>
        <p>Ce lien d'activation n'est plus valide ou a déjà été utilisé. Vous pouvez demander un nouvel email d'activation depuis la page de connexion MerchandBlock.</p>
        <a href="{% url 'login' %}" class="btn">Aller à la page de connexion</a>
    </div>
</body>
</html>
