<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié — InvoiceApp</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-base: #0F1629;
            --bg-card: #1A2238;
            --border: rgba(99, 102, 241, 0.15);
            --indigo: #6366F1;
            --indigo-light: #818CF8;
            --rose: #F43F5E;
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: var(--shadow);
        }

        .header { text-align: center; margin-bottom: 24px; }
        .logo-mark {
            width: 48px; height: 48px; margin: 0 auto 14px;
            background: linear-gradient(135deg, var(--indigo), #9333EA);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: var(--text-primary); }
        .subtitle { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-weight: 600; font-size: 13px; }
        .required { color: var(--rose); }

        input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: var(--text-muted); }
        input:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }

        button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 6px;
        }
        .btn-submit { background: var(--indigo); color: white; }
        .btn-submit:hover { background: #5254CC; transform: translateY(-1px); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .message {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13.5px;
            display: none;
            line-height: 1.6;
        }
        .message.show { display: block; }
        .message.success { background: rgba(16,185,129,0.15); color: #A7F3D0; }
        .message.error { background: rgba(244,63,94,0.15); color: #FECACA; }

        .back-link { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-secondary); }
        .back-link a { color: var(--indigo-light); text-decoration: none; font-weight: 600; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-mark">🔑</div>
            <h1>Mot de passe oublié</h1>
            <div class="subtitle">Indique l'email de ton compte entreprise, on t'envoie un lien pour en choisir un nouveau.</div>
        </div>

        <form id="forgotForm">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" required placeholder="utilisateur@exemple.com" autofocus>
            </div>

            <div id="message" class="message"></div>

            <button type="submit" class="btn-submit" id="submitBtn">Envoyer le lien de réinitialisation</button>
        </form>

        <div class="back-link">
            <a href="{% url 'login' %}">← Retour à la connexion</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgotForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Envoi...';

            const formData = new FormData(form);

            try {
                const response = await fetch('{% url "forgot_password" %}', {
                    method: 'POST',
                    body: formData,
                });
                const data = await response.json();

                messageDiv.classList.remove('success', 'error');
                messageDiv.textContent = data.message || data.error;
                messageDiv.classList.add(data.success ? 'success' : 'error', 'show');

                if (data.success) {
                    form.querySelector('input').disabled = true;
                    submitBtn.style.display = 'none';
                } else {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Envoyer le lien de réinitialisation';
                }
            } catch (error) {
                messageDiv.classList.remove('success');
                messageDiv.classList.add('error', 'show');
                messageDiv.textContent = 'Erreur réseau. Réessaie.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Envoyer le lien de réinitialisation';
            }
        });
    </script>
</body>
</html>
