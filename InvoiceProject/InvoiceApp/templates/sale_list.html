<div class="page" id="page-sales">
  <div class="page-header"><h1>Ventes (Sale)</h1><p>Historique des ventes produits</p></div>
  <div class="stats-row">
    <div class="stat-card"><span class="stat-label">Total</span><span class="stat-value" id="s-total">0</span><span class="stat-sub">ventes</span></div>
    <div class="stat-card"><span class="stat-label">Filtrés</span><span class="stat-value" id="s-filtered">0</span><span class="stat-sub">résultats</span></div>
    <div class="stat-card"><span class="stat-label">CA filtré</span><span class="stat-value" id="s-ca">0</span><span class="stat-sub">FCFA</span></div>
  </div>
  <div class="toolbar">
    <div class="search-wrap"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="s-search" placeholder="Rechercher client, produit..." oninput="renderTable('sales')"></div>
    <button class="btn btn-primary" onclick="alert('Nouvelle vente')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Nouvelle vente</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th><input type="checkbox" onchange="toggleAll('sales',this)"></th><th>Produit</th><th>Client</th><th>Qté</th><th>Prix unitaire</th><th>Total</th><th>Date</th><th>Actions</th></tr></thead>
      <tbody id="s-body"></tbody>
    </table>
    <div id="s-empty" class="empty" style="display:none"><p>Aucune vente trouvée</p></div>
    <div class="pagination-wrap"><span class="pag-info" id="s-info"></span><div class="pag-btns" id="s-pag"></div></div>
  </div>
</div>
