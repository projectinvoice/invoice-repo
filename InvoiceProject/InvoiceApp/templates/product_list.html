<div class="page" id="page-products">
  <div class="page-header"><h1>Produits (Product)</h1><p>Catalogue produits avec gestion du stock</p></div>
  <div class="stats-row">
    <div class="stat-card"><span class="stat-label">Total</span><span class="stat-value" id="p-total">0</span><span class="stat-sub">produits</span></div>
    <div class="stat-card"><span class="stat-label">Filtrés</span><span class="stat-value" id="p-filtered">0</span><span class="stat-sub">résultats</span></div>
    <div class="stat-card"><span class="stat-label">Valeur stock</span><span class="stat-value" id="p-stock-val">—</span><span class="stat-sub">FCFA</span></div>
  </div>
  <div class="toolbar">
    <div class="search-wrap"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="p-search" placeholder="Rechercher..." oninput="renderTable('products')"></div>
    <select id="p-stock" onchange="renderTable('products')"><option value="">Tout le stock</option><option value="low">Stock faible (≤5)</option><option value="ok">Stock normal</option><option value="zero">Rupture</option></select>
    <button class="btn btn-primary" onclick="alert('Ajouter un produit')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Ajouter</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th><input type="checkbox" onchange="toggleAll('products',this)"></th><th>Produit</th><th>Prix unitaire</th><th>Stock</th><th>Niveau stock</th><th>Entreprise</th><th>Actions</th></tr></thead>
      <tbody id="p-body"></tbody>
    </table>
    <div id="p-empty" class="empty" style="display:none"><p>Aucun produit trouvé</p></div>
    <div class="pagination-wrap"><span class="pag-info" id="p-info"></span><div class="pag-btns" id="p-pag"></div></div>
  </div>
</div>
