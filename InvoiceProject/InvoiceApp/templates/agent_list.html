<div class="page" id="page-agents">
  <div class="page-header"><h1>Agents</h1><p>Sous-utilisateurs gérés par les entreprises</p></div>
  <div class="stats-row">
    <div class="stat-card"><span class="stat-label">Total</span><span class="stat-value" id="a-total">0</span><span class="stat-sub">agents</span></div>
    <div class="stat-card"><span class="stat-label">Filtrés</span><span class="stat-value" id="a-filtered">0</span><span class="stat-sub">résultats</span></div>
  </div>
  <div class="toolbar">
    <div class="search-wrap"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="a-search" placeholder="Rechercher..." oninput="renderTable('agents')"></div>
    <select id="a-role" onchange="renderTable('agents')"><option value="">Tous les rôles</option><option>Commercial</option><option>Technicien</option><option>Manager</option><option>Support</option></select>
    <button class="btn btn-primary" onclick="alert('Ajouter un agent')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Ajouter</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th><input type="checkbox" onchange="toggleAll('agents',this)"></th><th>Agent</th><th>Email</th><th>Téléphone</th><th>Rôle</th><th>Entreprise</th><th>Actions</th></tr></thead>
      <tbody id="a-body"></tbody>
    </table>
    <div id="a-empty" class="empty" style="display:none"><p>Aucun agent trouvé</p></div>
    <div class="pagination-wrap"><span class="pag-info" id="a-info"></span><div class="pag-btns" id="a-pag"></div></div>
  </div>
</div>
