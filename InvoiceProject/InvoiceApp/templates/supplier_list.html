<div class="page" id="page-suppliers">
  <div class="page-header"><h1>Fournisseurs (Supplier)</h1><p>Fournisseurs de produits et matériaux</p></div>
  <div class="stats-row">
    <div class="stat-card"><span class="stat-label">Total</span><span class="stat-value" id="sup-total">0</span><span class="stat-sub">fournisseurs</span></div>
    <div class="stat-card"><span class="stat-label">Filtrés</span><span class="stat-value" id="sup-filtered">0</span><span class="stat-sub">résultats</span></div>
  </div>
  <div class="toolbar">
    <div class="search-wrap"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="sup-search" placeholder="Rechercher..." oninput="renderTable('suppliers')"></div>
    <button class="btn btn-primary" onclick="alert('Ajouter un fournisseur')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Ajouter</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th><input type="checkbox" onchange="toggleAll('suppliers',this)"></th><th>Fournisseur</th><th>Email</th><th>Téléphone</th><th>Adresse</th><th>Entreprise</th><th>Actions</th></tr></thead>
      <tbody id="sup-body"></tbody>
    </table>
    <div id="sup-empty" class="empty" style="display:none"><p>Aucun fournisseur trouvé</p></div>
    <div class="pagination-wrap"><span class="pag-info" id="sup-info"></span><div class="pag-btns" id="sup-pag"></div></div>
  </div>
</div>
