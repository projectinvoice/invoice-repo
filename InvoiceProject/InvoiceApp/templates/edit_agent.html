<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier Agent - {{ company_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .header-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6dd1 0%, #6b3f8f 100%);
        }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">
    <div class="header-section">
        <div>
            <h2>✏️ Modifier Agent</h2>
            <p class="mb-0">Entreprise: {{ company_name }}</p>
        </div>
        <a href="{% url 'list_agents' %}" class="btn btn-light">← Retour</a>
    </div>

    <div class="form-card">
        <form id="agentForm">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="first_name" class="form-label">Prénom *</label>
                <input type="text" class="form-control" id="first_name" name="first_name" value="{{ agent.first_name }}" required>
            </div>

            <div class="mb-3">
                <label for="last_name" class="form-label">Nom *</label>
                <input type="text" class="form-control" id="last_name" name="last_name" value="{{ agent.last_name }}" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email *</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ agent.email }}" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Téléphone</label>
                <input type="tel" class="form-control" id="phone" name="phone" value="{{ agent.phone }}">
            </div>

            <div class="mb-3">
                <label for="role_id" class="form-label">Rôle</label>
                <select class="form-select" id="role_id" name="role_id">
                    <option value="">-- Sans rôle --</option>
                    {% for role in agent_roles %}
                    <option value="{{ role.id }}" {% if agent.role.id == role.id %}selected{% endif %}>
                        {{ role.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">💾 Enregistrer les modifications</button>
                <a href="{% url 'list_agents' %}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>

        <div id="message" class="mt-3"></div>
    </div>
</div>

<script>
    document.getElementById('agentForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        try {
            const response = await fetch('', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            const msgDiv = document.getElementById('message');
            if (data.success) {
                msgDiv.innerHTML = '<div class="alert alert-success alert-dismissible fade show" role="alert">' + data.message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
                setTimeout(() => window.location.href = '{% url "list_agents" %}', 1500);
            } else {
                msgDiv.innerHTML = '<div class="alert alert-danger alert-dismissible fade show" role="alert">' + data.error + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
            }
        } catch (error) {
            console.error(error);
        }
    });
</script>

<script src="{% static 'InvoiceApp/js/ai_assistant.js' %}"></script>
</body>
</html>
