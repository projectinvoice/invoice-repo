<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier Produit - {{ company_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .header-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6dd1 0%, #6b3f8f 100%);
        }
        .product-preview {
            margin-top: 20px;
        }
        .product-preview img {
            max-width: 200px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">
    <div class="header-section">
        <div>
            <h2>✏️ Modifier Produit</h2>
            <p class="mb-0">Entreprise: {{ company_name }}</p>
        </div>
        <a href="{% url 'list_products' %}" class="btn btn-light">← Retour</a>
    </div>

    <div class="form-card">
        <form id="productForm" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="name" class="form-label">Nom du Produit *</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ product.name }}" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ product.description }}</textarea>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="price" class="form-label">Prix Unitaire (€) *</label>
                        <input type="number" class="form-control" id="price" name="price" value="{{ product.price }}" step="0.01" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="stock" class="form-label">Stock</label>
                        <input type="number" class="form-control" id="stock" name="stock" value="{{ product.stock }}" min="0">
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">Image du Produit</label>
                <input type="file" class="form-control" id="image" name="image" accept="image/*">
                {% if product.image %}
                <small class="text-muted d-block mt-2">Image actuelle: 
                    <img src="{{ product.image.url }}" style="max-width: 100px; border-radius: 5px; margin-top: 5px;">
                </small>
                {% endif %}
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">💾 Enregistrer les modifications</button>
                <a href="{% url 'list_products' %}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>

        <div id="message" class="mt-3"></div>
    </div>
</div>

<script>
    document.getElementById('productForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        try {
            const response = await fetch('', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            const msgDiv = document.getElementById('message');
            if (data.success) {
                msgDiv.innerHTML = '<div class="alert alert-success alert-dismissible fade show" role="alert">' + data.message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
                setTimeout(() => window.location.href = '{% url "list_products" %}', 1500);
            } else {
                msgDiv.innerHTML = '<div class="alert alert-danger alert-dismissible fade show" role="alert">' + data.error + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
            }
        } catch (error) {
            console.error(error);
        }
    });
</script>

</body>
</html>
